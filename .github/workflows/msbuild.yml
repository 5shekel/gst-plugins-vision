name: Windows

on: 
  push:
    branches: [ master ]
    paths-ignore:
    - 'README.md'
    - '**.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
    - 'README.md'
    - '**.yml'
  workflow_dispatch:

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v2
          
    - name: Install dependencies on windows
      run: |
          choco install --no-progres ninja cmake gstreamer gstreamer-devel 
          RefreshEnv.cmd
          ninja --version
          cmake --version
    
    - run: echo "GSTREAMER_1_0_ROOT_X86_64=C:\gstreamer\1.0\msvc_x86_64\" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
    
    - run: echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_x86_64\" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append

    - name: get ENV vars
      run:  printenv

    - name: Configure
      run: cmake -B ${{github.workspace}}/build -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/output/${{env.BUILD_TYPE}}
            
    - name: Build
      # Build your program with the given configuration
      run: |
        cd ${{github.workspace}}/build
        make install

